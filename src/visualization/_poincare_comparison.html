<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Poincare comparison</title>
<style>
body{font:14px system-ui;margin:16px;color:#223047;background:#fff}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
[hidden]{display:none!important}
button,select{padding:6px 12px}input[type=range]{flex:1;min-width:220px}
.timeline{display:grid;grid-template-columns:auto auto minmax(220px,1fr) auto;gap:4px 8px;align-items:center;flex:1;min-width:420px}
.timeline input[type=range]{width:100%;min-width:0}
.cycle-step{min-width:34px;padding:4px 9px;font-size:16px;line-height:1}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;min-width:750px}
.plots.four-panels{grid-template-columns:repeat(4,minmax(360px,1fr));min-width:1480px}
.plots.single-panel{grid-template-columns:minmax(0,760px);min-width:0;justify-content:center}
.plots.shared-field-layout.four-panels{grid-template-columns:repeat(4,minmax(0,1fr));min-width:0}
.plots.shared-field-layout>div{min-width:0}
.plots.shared-field-layout h3{font-size:16px}
.plots.shared-field-layout .plot-note{font-size:12px;line-height:1.4}
#field-section{margin-top:24px;border-top:1px solid #e1e5eb;padding-top:12px}
#field-plots{display:grid;grid-template-columns:minmax(0,700px);justify-content:center}
#field-section .controls{max-width:1000px;margin:14px auto}
canvas{width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair}h3{text-align:center;margin:4px}
#particles{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
label.particle{border:1px solid #ddd;border-radius:5px;padding:5px;cursor:pointer}
</style>
<h2>Synchronized Poincare sections</h2>
<p id="description">Wrapped coordinates x/L and y/L. Small dots: accumulated returns. Large dot: current return.
Select particles below to update every panel. Drag a square inside any plot to zoom all panels together.
After zooming, Shift-drag or right-drag to pan all panels.</p>
<div class="controls" id="dataset-control" hidden><label><span id="dataset-label">Dataset</span>
<select id="dataset-selector"></select></label><span id="dataset-note"></span></div>
<div class="controls"><button id="play">Play</button><button id="reset">Reset</button>
<div class="timeline"><label for="start-cycle">Start cycle</label><button class="cycle-step" id="start-previous" type="button" aria-label="Previous start cycle">−</button><input id="start-cycle" type="range" min="1" step="1" value="1"><button class="cycle-step" id="start-next" type="button" aria-label="Next start cycle">+</button>
<label for="cycle">Current cycle</label><button class="cycle-step" id="cycle-previous" type="button" aria-label="Previous current cycle">−</button><input id="cycle" type="range" min="1" step="1" value="1"><button class="cycle-step" id="cycle-next" type="button" aria-label="Next current cycle">+</button></div><strong id="status"></strong>
<label>Cycles/frame <select id="speed"><option>1</option><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label>
<label><input type="checkbox" id="trail" checked>Accumulate returns</label></div>
<div class="controls"><button id="full-view">Full view</button>
<button id="region-view" hidden>Selected region</button>
<label id="region-control" hidden>Region <select id="region-selector"></select></label>
<label>Point size <input id="point-size" type="range" min="0.5" max="6" step="0.5" value="2"></label><output id="point-size-value">2 px</output></div>
<div class="controls" id="field-controls" hidden>
<button id="phase-play">Play phase</button>
<label for="phase-step">Phase step</label><button id="phase-previous" aria-label="Previous phase step">−</button>
<input id="phase-step" type="range" min="0" max="50" step="1" value="0">
<button id="phase-next" aria-label="Next phase step">+</button><output id="phase-status"></output>
<label><input id="show-potential" type="checkbox" checked>Potential</label>
<label><input id="show-vectors" type="checkbox" checked>Vector field</label>
</div>
<div class="plots" id="plots"></div>
<div class="controls"><button id="all">Show all</button><button id="none">Hide all</button><button id="invert">Invert</button><button id="probe-only" hidden></button><span id="count"></span></div>
<div class="controls" id="particle-groups" hidden></div>
<div id="particles"></div>
<section id="field-section" hidden aria-label="Shared effective potential">
<div id="field-plots"></div>
</section>
<script>
const cfg=__CONFIG__;
if(cfg.title){document.title=cfg.title;document.querySelector('h2').textContent=cfg.title;}
if(cfg.description)document.getElementById('description').textContent=cfg.description;
function decodeFloat(data){return new Float32Array(Uint8Array.from(atob(data),c=>c.charCodeAt(0)).buffer);}
function decodePanels(records){return records.map(panel=>{
 const bytes=Uint8Array.from(atob(panel.data),c=>c.charCodeAt(0));
 const field=panel.field?{...panel.field,potential:decodeFloat(panel.field.potential),velocity:decodeFloat(panel.field.velocity),images:new Map()}:null;
 return {...panel,xy:new Float32Array(bytes.buffer),field};
});}
let panels=decodePanels(cfg.panels);
const firstCycle=cfg.firstCycle??1,N=(panels.find(panel=>!panel.static)?.shape[0]??1)+firstCycle-1,allIds=[...new Set(panels.flatMap(panel=>panel.ids))].sort((a,b)=>a-b);
// Detach only the field's DOM container; all panels retain common controls,
// particle identities, cycle interval, rho selection, and the same viewport.
const detachedField=cfg.fieldPlacement==='below_particles';
const topPanelCount=panels.filter(panel=>!detachedField||!panel.field).length;
const plots=document.getElementById('plots');
if(topPanelCount===4)plots.classList.add('four-panels');
if(topPanelCount===1)plots.classList.add('single-panel');
if(detachedField){
 plots.classList.add('shared-field-layout');
 const section=document.getElementById('field-section');section.hidden=false;
 section.prepend(document.getElementById('field-controls'));
}
const colorById=new Map();panels.forEach(panel=>panel.ids.forEach((id,p)=>colorById.set(id,panel.colors[p])));
const selected=new Set(allIds),boxes=[];
const slider=document.getElementById('cycle'),startSlider=document.getElementById('start-cycle'),play=document.getElementById('play');
const speed=document.getElementById('speed'), trail=document.getElementById('trail');
slider.min=firstCycle;startSlider.min=firstCycle;startSlider.value=firstCycle;slider.max=N;startSlider.max=N;speed.value=String(cfg.step);
slider.value=cfg.initialCycle??1;
if(!speed.value){const o=new Option(cfg.step,cfg.step);speed.add(o);speed.value=String(cfg.step);}
let timer=null,phaseTimer=null;
const phaseSlider=document.getElementById('phase-step'),phasePlay=document.getElementById('phase-play');
const showPotential=document.getElementById('show-potential'),showVectors=document.getElementById('show-vectors');
function stopPhase(){clearInterval(phaseTimer);phaseTimer=null;phasePlay.textContent='Play phase';}
phaseSlider.oninput=()=>{stopPhase();draw();};
function phaseStep(delta){stopPhase();phaseSlider.value=Math.max(0,Math.min(Number(phaseSlider.max),Number(phaseSlider.value)+delta));draw();}
document.getElementById('phase-previous').onclick=()=>phaseStep(-1);
document.getElementById('phase-next').onclick=()=>phaseStep(1);
phasePlay.onclick=()=>{if(phaseTimer){stopPhase();return;}phasePlay.textContent='Pause phase';phaseTimer=setInterval(()=>{phaseSlider.value=(Number(phaseSlider.value)+1)%(Number(phaseSlider.max)+1);draw();},150);};
showPotential.onchange=showVectors.onchange=draw;
// A square viewport in the data's coordinate units is shared by every panel.
const bounds=cfg.coordinateBounds??{x:0,y:0,span:1},axisLabels=cfg.axisLabels??['x / L','y / L'];
const plot={left:78,top:20,size:500,canvas:600};
let view={...(cfg.initialView??bounds)},drag=null;
const pointSize=document.getElementById('point-size');
function plotPoint(event,canvas){
 const r=canvas.getBoundingClientRect();
 return {x:Math.max(0,Math.min(1,(plot.canvas*(event.clientX-r.left)/r.width-plot.left)/plot.size)),
         y:Math.max(0,Math.min(1,1-(plot.canvas*(event.clientY-r.top)/r.height-plot.top)/plot.size))};
}
function square(a,b){
 const dx=b.x-a.x,dy=b.y-a.y,sx=dx<0?-1:1,sy=dy<0?-1:1;
 const span=Math.min(Math.max(Math.abs(dx),Math.abs(dy)),sx>0?1-a.x:a.x,sy>0?1-a.y:a.y);
 return {x:sx>0?a.x:a.x-span,y:sy>0?a.y:a.y-span,span};
}
const canvases=panels.map(dataPanel=>{
 const panel=document.createElement('div'),h=document.createElement('h3'),c=document.createElement('canvas');
 h.textContent=dataPanel.title;c.width=600;c.height=600;c.setAttribute('role','img');c.setAttribute('aria-label',dataPanel.title);panel.append(h,c);const note=document.createElement('p');note.className='plot-note';panel.append(note);
 const container=detachedField&&dataPanel.field?document.getElementById('field-plots'):plots;
 container.append(panel);return c;
});
canvases.forEach(canvas=>{
 canvas.oncontextmenu=event=>event.preventDefault();
 function move(event){
  if(drag?.canvas!==canvas||drag.id!==event.pointerId)return;
  const point=plotPoint(event,canvas);
  if(drag.pan){
   // Preserve the initial square extent and keep the viewport inside the cell.
   const initial=drag.initial,limit=bounds.span-initial.span;
   view={x:Math.max(bounds.x,Math.min(bounds.x+limit,initial.x-(point.x-drag.start.x)*initial.span)),
         y:Math.max(bounds.y,Math.min(bounds.y+limit,initial.y-(point.y-drag.start.y)*initial.span)),span:initial.span};
  }else drag.box=square(drag.start,point);
  draw();
 }
 canvas.onpointerdown=event=>{
  if(drag||(event.button!==0&&event.button!==2))return;
  const r=canvas.getBoundingClientRect(),x=600*(event.clientX-r.left)/r.width,y=600*(event.clientY-r.top)/r.height;
  if(x<plot.left||x>plot.left+plot.size||y<plot.top||y>plot.top+plot.size)return;
  event.preventDefault();
  const start=plotPoint(event,canvas),pan=event.shiftKey||event.button===2;
  drag={canvas,id:event.pointerId,start,box:square(start,start),pan,initial:{...view}};
  canvas.style.cursor=pan?'grabbing':'crosshair';
  canvas.setPointerCapture(event.pointerId);
 };
 canvas.onpointermove=move;
 canvas.onpointerup=event=>{
  if(drag?.canvas!==canvas||drag.id!==event.pointerId)return;
  move(event);
  const {box,pan}=drag;drag=null;canvas.style.cursor='crosshair';
  if(!pan&&box.span*plot.size>=5&&view.span*box.span>=bounds.span*1e-6)view={x:view.x+box.x*view.span,y:view.y+box.y*view.span,span:view.span*box.span};
  canvas.releasePointerCapture(event.pointerId);draw();
 };
 canvas.onpointercancel=canvas.onlostpointercapture=()=>{canvas.style.cursor='crosshair';if(drag?.canvas===canvas){drag=null;draw();}};
});
allIds.forEach((id,p)=>{
 const label=document.createElement('label'),box=document.createElement('input');
 label.className='particle';label.style.borderLeft='5px solid '+colorById.get(id);box.type='checkbox';box.checked=true;
 box.onchange=()=>{box.checked?selected.add(id):selected.delete(id);draw();};
 label.append(box,document.createTextNode(cfg.particleLabels?.[id]??('Particle '+id)));document.getElementById('particles').append(label);boxes.push(box);
});
if(cfg.particleGroups?.length){
 const container=document.getElementById('particle-groups');container.hidden=false;
 container.append(document.createTextNode('Isolate: '));
 cfg.particleGroups.forEach(group=>{
  const button=document.createElement('button');button.textContent=group.label;
  button.onclick=()=>{selected.clear();group.ids.forEach(id=>selected.add(id));boxes.forEach((box,p)=>box.checked=selected.has(allIds[p]));draw();};
  container.append(button);
 });
}
// Raster colors and arrow lengths share fixed scales across all phases of a rho.
function heatColor(f){
 const stops=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
 const z=Math.max(0,Math.min(1,f))*4,i=Math.min(3,Math.floor(z)),a=z-i;
 return stops[i].map((v,k)=>Math.round(v*(1-a)+stops[i+1][k]*a));
}
function drawField(ctx,field,phase){
 const {left,top,size}=plot,b=field.bounds,n=field.shape[1],vn=field.vectorShape[1];
 const px=x=>left+(x-view.x)/view.span*size,py=y=>top+(1-(y-view.y)/view.span)*size;
 if(showPotential.checked){
  if(!field.images.has(phase)){
   const raster=document.createElement('canvas');raster.width=n;raster.height=n;
   const rc=raster.getContext('2d'),im=rc.createImageData(n,n),range=field.maximum-field.minimum||1;
   for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const rgb=heatColor((field.potential[(phase*n+y)*n+x]-field.minimum)/range),i=((n-1-y)*n+x)*4;
    im.data.set([...rgb,255],i);
   }rc.putImageData(im,0,0);field.images.set(phase,raster);
  }
  ctx.drawImage(field.images.get(phase),px(b.x),py(b.y+b.span),b.span/view.span*size,b.span/view.span*size);
 }
 if(showVectors.checked&&field.maxSpeed>0){
  const scale=.75*b.span/vn/field.maxSpeed;
  for(let y=0;y<vn;y++)for(let x=0;x<vn;x++){
   const i=((phase*vn+y)*vn+x)*2,ux=field.velocity[i],uy=field.velocity[i+1];
   if(Math.hypot(ux,uy)<1e-12*field.maxSpeed)continue;
   const cx=b.x+(x+.5)*b.span/vn,cy=b.y+(y+.5)*b.span/vn;
   const ax=px(cx-.5*ux*scale),ay=py(cy-.5*uy*scale),bx=px(cx+.5*ux*scale),by=py(cy+.5*uy*scale);
   const angle=Math.atan2(by-ay,bx-ax),head=Math.min(5,Math.hypot(bx-ax,by-ay)*.45);
   ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.moveTo(bx-head*Math.cos(angle-.5),by-head*Math.sin(angle-.5));ctx.lineTo(bx,by);ctx.lineTo(bx-head*Math.cos(angle+.5),by-head*Math.sin(angle+.5));
   ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#102030';ctx.lineWidth=1.3;ctx.stroke();
  }
 }
}
function draw(){
 const cycle=Number(slider.value),startCycle=Number(startSlider.value);
 const diameter=Number(pointSize.value),digits=Math.max(2,Math.ceil(-Math.log10(view.span))+2);
 document.getElementById('point-size-value').textContent=diameter+' px';
 document.getElementById('status').textContent='Cycles '+startCycle+'–'+cycle+' / '+N;
 document.getElementById('count').textContent=selected.size+' / '+allIds.length+' selected';
 const activeField=panels.find(p=>p.field)?.field;
 document.getElementById('field-controls').hidden=!activeField;
 if(activeField){phaseSlider.max=activeField.phases.length-1;document.getElementById('phase-status').textContent=`Step ${phaseSlider.value} / ${phaseSlider.max} · phase ${activeField.phases[Number(phaseSlider.value)].toFixed(2)} · endpoints coincide`;}

 canvases.forEach((canvas,m)=>{
 const {xy,ids,colors,shape,static:fixed,field}=panels[m],P=shape[1];
 const ctx=canvas.getContext('2d'),{left,top,size}=plot;
 ctx.clearRect(0,0,600,600);ctx.font='15px system-ui';ctx.lineWidth=1;
 for(let k=0;k<=4;k++){
 const f=k/4;ctx.strokeStyle='#e1e5eb';ctx.beginPath();ctx.moveTo(left+f*size,top);ctx.lineTo(left+f*size,top+size);
 ctx.moveTo(left,top+f*size);ctx.lineTo(left+size,top+f*size);ctx.stroke();
 ctx.fillStyle='#334155';ctx.textAlign='center';ctx.fillText((view.x+f*view.span).toFixed(digits),left+f*size,top+size+24);
 ctx.textAlign='right';ctx.fillText((view.y+(1-f)*view.span).toFixed(digits),left-8,top+f*size+5);
 }
 ctx.textAlign='center';ctx.fillText(axisLabels[0],left+size/2,590);
 ctx.save();ctx.translate(16,top+size/2);ctx.rotate(-Math.PI/2);ctx.fillText(axisLabels[1],0,0);ctx.restore();
 ctx.save();ctx.beginPath();ctx.rect(left,top,size,size);ctx.clip();
 if(field)drawField(ctx,field,Number(phaseSlider.value));
 if(!field)for(let p=0;p<P;p++){
 if(!selected.has(ids[p]))continue;
 ctx.fillStyle=colors[p];
 if(trail.checked&&!fixed){const highlighted=ids[p]===cfg.highlightParticle||(cfg.highlightParticles??[]).includes(ids[p]),pointDiameter=highlighted?Math.max(3,diameter):diameter;ctx.globalAlpha=highlighted?1:.55;
 for(let t=startCycle-firstCycle+1;t<=cycle-firstCycle;t++){const i=(t*P+p)*2;ctx.fillRect(left+(xy[i]-view.x)/view.span*size-pointDiameter/2,top+(1-(xy[i+1]-view.y)/view.span)*size-pointDiameter/2,pointDiameter,pointDiameter);}}
 ctx.globalAlpha=1;const i=((fixed?0:cycle-firstCycle)*P+p)*2;
 if(fixed||cycle!==startCycle){ctx.beginPath();ctx.arc(left+(xy[i]-view.x)/view.span*size,top+(1-(xy[i+1]-view.y)/view.span)*size,diameter*2,0,2*Math.PI);ctx.fill();}
 }
 // Draw interval-start rings last, so dense return clouds cannot hide them.
 if(!field&&!fixed)for(let p=0;p<P;p++){
  if(!selected.has(ids[p]))continue;
  const i=((startCycle-firstCycle)*P+p)*2;
  ctx.beginPath();ctx.arc(left+(xy[i]-view.x)/view.span*size,top+(1-(xy[i+1]-view.y)/view.span)*size,Math.max(6,diameter*3),0,2*Math.PI);
  ctx.strokeStyle='white';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle=colors[p];ctx.lineWidth=2;ctx.stroke();
 }
 ctx.restore();
 const note=canvas.nextElementSibling;
 if(field){
  note.textContent=`Effective Hρ (${field.units}). Arrows: GC drift, lengths proportional to speed; fixed scale across phases, maximum ${field.maxSpeed.toPrecision(4)}. Phase ${field.phases[Number(phaseSlider.value)].toFixed(2)}.`;
  const gradient=ctx.createLinearGradient(left,0,left+size,0);
  for(let k=0;k<=4;k++)gradient.addColorStop(k/4,'rgb('+heatColor(k/4).join(',')+')');
  ctx.fillStyle=gradient;ctx.fillRect(left,552,size,10);ctx.fillStyle='#334155';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText(field.minimum.toPrecision(4),left,577);ctx.textAlign='right';ctx.fillText(field.maximum.toPrecision(4),left+size,577);
 }else if(!fixed)note.textContent=`Hollow circles: particle positions at Start cycle ${startCycle}. Filled dots: subsequent returns; larger dots: Current cycle ${cycle}.`;

 if(drag&&!drag.pan){const b=drag.box;ctx.save();ctx.strokeStyle='#111827';ctx.fillStyle='rgba(59,130,246,.12)';ctx.setLineDash([6,4]);ctx.fillRect(left+b.x*size,top+(1-b.y-b.span)*size,b.span*size,b.span*size);ctx.strokeRect(left+b.x*size,top+(1-b.y-b.span)*size,b.span*size,b.span*size);ctx.restore();}
 });
}
function stop(){clearInterval(timer);timer=null;play.textContent='Play';}
function stepCycle(input,delta){
 stop();
 const minimum=input===slider?Number(startSlider.value):firstCycle;
 const maximum=input===startSlider?Number(slider.value):N;
 input.value=Math.max(minimum,Math.min(maximum,Number(input.value)+delta));
 draw();
}
document.getElementById('start-previous').onclick=()=>stepCycle(startSlider,-1);
document.getElementById('start-next').onclick=()=>stepCycle(startSlider,1);
document.getElementById('cycle-previous').onclick=()=>stepCycle(slider,-1);
document.getElementById('cycle-next').onclick=()=>stepCycle(slider,1);
play.onclick=()=>{if(timer){stop();return;}if(Number(slider.value)===N)slider.value=startSlider.value;
 play.textContent='Pause';timer=setInterval(()=>{slider.value=Math.min(N,Number(slider.value)+Number(speed.value));draw();if(Number(slider.value)===N)stop();},100);};
startSlider.oninput=()=>{if(Number(slider.value)<Number(startSlider.value))slider.value=startSlider.value;draw();};
slider.oninput=()=>{if(Number(slider.value)<Number(startSlider.value))slider.value=startSlider.value;draw();};trail.onchange=draw;
pointSize.oninput=draw;
document.getElementById('full-view').onclick=()=>{view={...bounds};drag=null;draw();};
document.getElementById('reset').onclick=()=>{stop();slider.value=startSlider.value;draw();};
function select(mode){allIds.forEach((id,p)=>{const on=mode==='all'||(mode==='invert'&&!selected.has(id));on?selected.add(id):selected.delete(id);boxes[p].checked=on;});draw();}
for(const mode of ['all','none','invert'])document.getElementById(mode).onclick=()=>select(mode);
if(cfg.initialView){const button=document.getElementById('region-view');button.hidden=false;
 button.onclick=()=>{view={...cfg.initialView};drag=null;draw();};}
if(cfg.highlightParticle!==undefined){const button=document.getElementById('probe-only');button.hidden=false;
 button.textContent='Only particle '+cfg.highlightParticle;
 button.onclick=()=>{select('none');selected.add(cfg.highlightParticle);boxes[allIds.indexOf(cfg.highlightParticle)].checked=true;draw();};}
if(cfg.regions?.length){
 const control=document.getElementById('region-control'),selector=document.getElementById('region-selector');
 control.hidden=false;
 cfg.regions.forEach((region,index)=>selector.add(new Option(region.label,String(index))));
 const chooseRegion=()=>{
  const isolated=selected.size===1&&selected.has(cfg.highlightParticle);
  const region=cfg.regions[Number(selector.value)];
  cfg.initialView={...region.view};view={...region.view};drag=null;cfg.highlightParticle=region.particle;
  const only=document.getElementById('probe-only');only.hidden=false;only.textContent='Only particle '+region.particle;
  only.onclick=()=>{select('none');selected.add(cfg.highlightParticle);boxes[allIds.indexOf(cfg.highlightParticle)].checked=true;draw();};
  const zoom=document.getElementById('region-view');zoom.hidden=false;zoom.onclick=()=>{view={...cfg.initialView};drag=null;draw();};
  // Preserve isolation when moving from one probe's region to another.
  if(isolated){selected.clear();boxes.forEach(box=>box.checked=false);}
  selected.add(region.particle);boxes[allIds.indexOf(region.particle)].checked=true;draw();
 };
 selector.onchange=chooseRegion;chooseRegion();
}
if(cfg.datasets?.length){
 const control=document.getElementById('dataset-control'),selector=document.getElementById('dataset-selector');
 control.hidden=false;document.getElementById('dataset-label').textContent=cfg.datasetLabel;
 cfg.datasets.forEach(dataset=>{
  const option=new Option(dataset.label+(dataset.panels?'':' — not calculated'),dataset.key);
  option.disabled=!dataset.panels;selector.add(option);
 });
 selector.value=cfg.selectedDataset;
 const chooseDataset=()=>{
  const dataset=cfg.datasets.find(item=>item.key===selector.value);
  if(!dataset?.panels)return;
  stop();stopPhase();panels=decodePanels(dataset.panels);
  canvases.forEach((canvas,index)=>{canvas.previousElementSibling.textContent=panels[index].title;canvas.setAttribute('aria-label',panels[index].title);});
  document.getElementById('dataset-note').textContent=dataset.note;
  draw();
 };
 selector.onchange=chooseDataset;chooseDataset();
}
draw();
</script></html>
