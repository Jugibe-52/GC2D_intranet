name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints.txt

      - name: Install development environment
        run: python -m pip install -r requirements.txt

      - name: Type check source packages
        run: python -m mypy src

      - name: Run test suite
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/guiding-center-matplotlib
        run: python -m unittest discover -s tests -v

      - name: Run supported examples
        run: |
          python examples/gc_orbit.py
          python examples/projected_abba.py

      - name: Build distributions
        run: python -m build

  jax-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install optional JAX CPU execution
        run: python -m pip install -c constraints.txt -e '.[jax]'
      - name: Compare JAX fields and every integration family with SciPy
        run: |
          python -m unittest discover -s tests -p 'test_jax_potential.py' -q
          python -m unittest discover -s tests -p 'test_potential_execution.py' -q
          python -m unittest discover -s tests -p 'test_jax_rk4.py' -q
          python -m unittest discover -s tests -p 'test_jax_methods.py' -q
          python -m unittest discover -s tests -p 'test_rk4_execution_study.py' -q
