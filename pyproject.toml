[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guiding-center-intranet"
version = "0.1.0"
description = "Guiding-center simulation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"numpy==1.26.4",
	"matplotlib==3.10.9",
	"scipy==1.17.1",
	"h5py==3.16.0",
	"multiprocess==0.70.19",
	"scikit-learn==1.8.0",
	"sympy==1.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["classes", "workflows", "pyhamsys", "pyhamsys.solvers"]
py-modules = [
	"config",
	"classes_api",
	"workflows_api",
	"symplectic",
	"symplectic_modules",
	"config_logging",
	"contracts",
]

[project.optional-dependencies]
dev = ["mypy>=1.10,<2"]

[tool.mypy]
python_version = "3.11"
files = ["src", "run_fourier.py", "run_potential.py"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
ignore_missing_imports = true
incremental = false
sqlite_cache = false
