[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guiding-center-intranet"
version = "0.1.0"
description = "Guiding-center simulation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"h5py>=3.10,<4",
	"numpy>=1.26,<3",
	"scipy>=1.12,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
	"diagnostics*",
	"dynamics*",
	"initial_conditions*",
	"potential*",
	"simulation*",
	"studies*",
	"visualization*",
]
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]

[project.optional-dependencies]
visualization = ["matplotlib>=3.8,<4"]
notebook = [
	"matplotlib>=3.8,<4",
	"nbclient>=0.10,<1",
	"nbformat>=5.10,<6",
	"ipykernel>=6,<8",
	"sympy>=1.14,<2",
]
dev = [
	"build>=1.2,<2",
	"mypy>=1.10,<2",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
ignore_missing_imports = true
incremental = false
sqlite_cache = false
