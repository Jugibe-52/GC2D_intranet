[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gc2d-intranet"
version = "0.1.0"
description = "GC2D simulation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"numpy==1.26.4",
	"matplotlib==3.10.9",
	"scipy==1.17.1",
	"pyhamsys==0.31",
	"h5py==3.16.0",
	"multiprocess==0.70.19",
	"scikit-learn==1.8.0",
	"sympy==1.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["classes", "workflows"]
py-modules = [
	"config",
	"gc2d_classes",
	"gc2d_workflows",
	"gc2d_symp",
	"gc2d_symp_modules",
	"config_logging",
]
